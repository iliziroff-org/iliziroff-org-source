<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f2ec">
    <meta name="description" content="iliziroff.org — personal links and projects.">

    <title>iliziroff.org</title>

    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <style>
      :root {
        color-scheme: light;
        --paper: #f4f2ec;
        --ink: #11110f;
        --muted: #6d6b65;
        --line: rgba(17, 17, 15, 0.2);
        --page-pad: clamp(1.25rem, 3.2vw, 3.5rem);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--paper);
        scroll-behavior: smooth;
      }

      body {
        min-height: 100svh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }

      .page {
        display: grid;
        grid-template-rows: auto minmax(13rem, 1fr) auto;
        min-height: 100svh;
        padding: max(var(--page-pad), env(safe-area-inset-top))
          max(var(--page-pad), env(safe-area-inset-right))
          max(var(--page-pad), env(safe-area-inset-bottom))
          max(var(--page-pad), env(safe-area-inset-left));
      }

      .brand {
        display: inline-block;
        width: fit-content;
        font-size: clamp(1.05rem, 1.3vw, 1.3rem);
        font-weight: 700;
        letter-spacing: -0.05em;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(10rem, 0.75fr) minmax(17rem, 1.25fr);
        align-items: center;
        gap: clamp(2.5rem, 8vw, 10rem);
        width: min(62rem, 100%);
        margin: 0 auto;
        padding: clamp(4rem, 10vh, 8rem) 0;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .links {
        display: grid;
        margin-top: 1.35rem;
        border-top: 1px solid var(--line);
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 3.5rem;
        border-bottom: 1px solid var(--line);
        font-size: clamp(1.05rem, 1.8vw, 1.45rem);
        letter-spacing: -0.035em;
        transition: padding 180ms ease, color 180ms ease;
      }

      .link::after {
        content: "↗";
        font-size: 0.85em;
        transition: transform 180ms ease;
      }

      .link:hover {
        padding-left: 0.45rem;
        color: var(--muted);
      }

      .link:hover::after {
        transform: translate(0.18rem, -0.18rem);
      }

      .intro {
        max-width: 34rem;
      }

      .intro h1 {
        margin: 0;
        font-size: clamp(3.7rem, 9.2vw, 9rem);
        font-weight: 500;
        letter-spacing: -0.085em;
        line-height: 0.8;
      }

      .intro p {
        max-width: 27rem;
        margin: clamp(2rem, 4vw, 3rem) 0 0;
        color: var(--muted);
        font-size: clamp(0.95rem, 1.2vw, 1.1rem);
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1.5rem;
        border-top: 1px solid var(--line);
        padding-top: 1rem;
      }

      .talk {
        font-size: clamp(1.1rem, 2vw, 1.8rem);
        font-weight: 700;
        letter-spacing: -0.045em;
      }

      .arrow {
        display: inline-block;
        font-size: clamp(2.8rem, 6vw, 5.5rem);
        font-weight: 300;
        line-height: 0.7;
        transition: transform 180ms ease;
      }

      .footer:hover .arrow {
        transform: translate(0.25rem, -0.25rem);
      }

      @media (max-width: 720px) {
        .page {
          grid-template-rows: auto 1fr auto;
        }

        .content {
          grid-template-columns: 1fr;
          align-content: center;
          gap: 4.5rem;
          margin: 0;
          padding: 4rem 0 5rem;
        }

        .intro {
          grid-row: 1;
        }

        .contact {
          grid-row: 2;
        }

        .intro h1 {
          font-size: clamp(4.1rem, 23vw, 7rem);
        }

        .links {
          margin-top: 1rem;
        }

        .link {
          min-height: 3.35rem;
          font-size: 1.15rem;
        }

        .footer {
          align-items: center;
        }
      }

      @media (max-width: 370px) {
        .intro h1 {
          font-size: 3.65rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <a class="brand" href="/" aria-label="iliziroff.org — главная">iliziroff.</a>

      <section class="content" aria-label="Основная информация">
        <div class="contact">
          <p class="eyebrow">Me</p>
          <nav class="links" aria-label="Ссылки">
            <a class="link" href="https://x.com/iliziroff" target="_blank" rel="noopener noreferrer">X</a>
            <a class="link" href="https://github.com/iliziroff-org" target="_blank" rel="noopener noreferrer">Github</a>
            <a class="link" href="https://ekliz.iliziroff.org">ekliz</a>
          </nav>
        </div>

        <div class="intro">
          <h1>hello.</h1>
          <p>Personal space for ideas, experiments and projects.</p>
        </div>
      </section>

      <a class="footer" href="mailto:support@iliziroff.org" aria-label="Написать на support@iliziroff.org">
        <span class="talk">LET’S TALK</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </main>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js");
        });
      }
    </script>
  </body>
</html>
