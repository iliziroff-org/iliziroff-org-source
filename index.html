<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iliziroff.org</title>

  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="iliziroff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #050505;
      --pad-x: clamp(28px, 8vw, 98px);
      --pad-y: clamp(28px, 5.5vh, 54px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100svh;
      padding: var(--pad-y) var(--pad-x);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 280px);
      grid-template-rows: auto 1fr auto;
      column-gap: clamp(40px, 8vw, 140px);
    }

    .brand {
      grid-column: 1;
      grid-row: 1;
      align-self: start;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .details {
      grid-column: 2;
      grid-row: 2;
      align-self: center;
      justify-self: start;
      width: 100%;
      transform: translateY(-2vh);
    }

    .details-title {
      margin: 0 0 18px;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .links a {
      position: relative;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 400;
    }

    .links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width 180ms ease;
    }

    .links a:hover::after,
    .links a:focus-visible::after {
      width: 100%;
    }

    .contact {
      grid-column: 1 / -1;
      grid-row: 3;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 32px;
      padding-bottom: clamp(8px, 1.5vh, 18px);
    }

    .contact-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 clamp(20px, 3vh, 30px);
      font-size: 9px;
      line-height: 1;
      font-weight: 400;
    }

    .talk {
      margin: 0;
      font-size: clamp(58px, 7.5vw, 94px);
      line-height: 0.86;
      font-weight: 400;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .arrow-link {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      margin-bottom: 4px;
    }

    .arrow {
      width: 62px;
      height: 62px;
      overflow: visible;
    }

    .arrow path {
      stroke: var(--text);
      stroke-width: 7;
      stroke-linecap: square;
      stroke-linejoin: miter;
      fill: none;
    }

    @media (max-width: 760px) {
      :root {
        --pad-x: clamp(20px, 6vw, 28px);
        --pad-y: max(22px, env(safe-area-inset-top));
      }

      body {
        min-width: 320px;
      }

      .page {
        min-height: 100svh;
        padding-top: max(24px, calc(env(safe-area-inset-top) + 12px));
        padding-right: max(var(--pad-x), env(safe-area-inset-right));
        padding-bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
        padding-left: max(var(--pad-x), env(safe-area-inset-left));
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(240px, 1fr) auto;
        row-gap: 18px;
      }

      .brand {
        grid-column: 1;
        grid-row: 1;
        font-size: clamp(19px, 5.4vw, 22px);
      }

      .details {
        grid-column: 1;
        grid-row: 2;
        align-self: center;
        justify-self: end;
        width: min(46vw, 190px);
        transform: none;
        padding-top: 2vh;
      }

      .details-title {
        font-size: 15px;
        margin-bottom: 16px;
      }

      .links {
        gap: 12px;
      }

      .links a {
        font-size: 12px;
        line-height: 1.35;
      }

      .contact {
        grid-column: 1;
        grid-row: 3;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding-bottom: 0;
      }

      .eyebrow {
        margin-bottom: 16px;
        font-size: 9px;
      }

      .talk {
        font-size: clamp(50px, 15.3vw, 78px);
        line-height: .88;
        white-space: nowrap;
      }

      .arrow-link {
        width: clamp(48px, 13vw, 58px);
        height: clamp(48px, 13vw, 58px);
        align-self: end;
        margin-bottom: 0;
      }

      .arrow {
        width: clamp(40px, 11vw, 50px);
        height: clamp(40px, 11vw, 50px);
      }
    }

    @media (max-width: 390px) {
      .details { width: min(48vw, 175px); }
      .talk { font-size: clamp(46px, 14.6vw, 60px); }
      .arrow-link { width: 46px; height: 46px; }
      .arrow { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">iliziroff.</header>

    <section class="details" aria-labelledby="me-title">
      <h2 class="details-title" id="me-title">Me</h2>
      <nav class="links" aria-label="Social links">
        <a href="https://x.com/iliziroff" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://github.com/iliziroff-org" target="_blank" rel="noopener noreferrer">Github</a>
      </nav>
    </section>

    <section class="contact">
      <div class="contact-copy">
        <p class="eyebrow">Got A Project In Mind?</p>
        <h1 class="talk">LET'S TALK</h1>
      </div>

      <a
        class="arrow-link"
        href="https://x.com/iliziroff"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contact iliziroff on X"
      >
        <svg class="arrow" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 50 L50 14 M25 14 H50 V39" />
        </svg>
      </a>
    </section>
  </main>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
