<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal page of iliziroff." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='12' r='7' fill='white'/%3E%3Crect x='25' y='25' width='14' height='34' rx='7' fill='white'/%3E%3C/svg%3E"
    />
    <title>iliziroff.</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #000;
        --foreground: #fff;
        --muted: #8f8f8f;
        --muted-hover: #e2e2e2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: clamp(28px, 6vw, 72px) 24px;
      }

      .identity {
        display: flex;
        width: min(100%, 920px);
        align-items: center;
        flex-direction: column;
        text-align: center;
      }

      .avatar {
        position: relative;
        width: clamp(180px, 25vw, 280px);
        margin-bottom: clamp(24px, 4vw, 40px);
        isolation: isolate;
      }

      .avatar::before {
        position: absolute;
        z-index: -1;
        inset: 12% 4% -8%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgb(38 174 255 / 48%) 0%,
          rgb(0 119 255 / 22%) 42%,
          transparent 72%
        );
        content: '';
        filter: blur(24px);
      }

      .avatar::after {
        position: absolute;
        z-index: -1;
        right: 16%;
        bottom: -12px;
        left: 16%;
        height: 22px;
        border-radius: 50%;
        background: rgb(0 132 255 / 24%);
        content: '';
        filter: blur(18px);
      }

      .avatar img {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 10px rgb(74 199 255 / 18%));
      }

      h1 {
        margin: 0;
        font-size: clamp(3.75rem, 13vw, 9rem);
        font-weight: 700;
        letter-spacing: -0.075em;
        line-height: 0.85;
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }

      .social-link {
        position: relative;
        padding-block: 5px;
        color: var(--muted);
        font-size: clamp(0.78rem, 1.15vw, 0.9rem);
        letter-spacing: 0.055em;
        text-decoration: none;
        transition:
          color 180ms ease,
          text-shadow 180ms ease;
      }

      .social-link::after {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #42bdff, transparent);
        content: '';
        transform: scaleX(0);
        transition: transform 180ms ease;
      }

      .social-link:hover {
        color: #fff;
        text-shadow: 0 0 14px rgb(66 189 255 / 28%);
      }

      .social-link:hover::after,
      .social-link:focus-visible::after {
        transform: scaleX(1);
      }

      .link-separator {
        color: rgb(79 190 255 / 62%);
        font-size: 0.78rem;
      }

      .social-link:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 4px;
      }

      @media (max-width: 480px) {
        main {
          padding-inline: 18px;
        }

        .avatar {
          width: min(56vw, 210px);
          margin-bottom: 26px;
        }

        .social-links {
          flex-direction: column;
          gap: 7px;
        }

        .link-separator {
          display: none;
        }

        h1 {
          font-size: clamp(3.5rem, 20vw, 5.25rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .social-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="identity" aria-label="Профиль iliziroff">
        <div class="avatar" aria-hidden="true">
          <img src="avatar-transparent.png" alt="" />
        </div>
        <h1>iliziroff.</h1>
        <nav class="social-links" aria-label="Социальные ссылки">
          <a
            class="social-link"
            href="https://github.com/iliziroff"
            target="_blank"
            rel="noreferrer"
            aria-label="Открыть профиль iliziroff на GitHub в новой вкладке"
          >
            github.com/iliziroff
          </a>
          <span class="link-separator" aria-hidden="true">·</span>
          <a
            class="social-link telegram-link"
            href="https://t.me/rosiebit"
            target="_blank"
            rel="noreferrer"
            aria-label="Открыть Telegram rosiebit в новой вкладке"
          >
            t.me/rosiebit
          </a>
          <span class="link-separator" aria-hidden="true">·</span>
          <a
            class="social-link email-link"
            href="mailto:support@iliziroff.org"
            aria-label="Написать на почту support@iliziroff.org"
          >
            support@iliziroff.org
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
